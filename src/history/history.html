<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>导出历史 — 码藏</title>
  <style>
    :root { --accent:#0d9488; --fg:#1f2329; --muted:#646a73; --line:#e5e6eb; }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: #f5f6f7; color: var(--fg);
      font: 14px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", Segoe UI, sans-serif;
    }
    .wrap { max-width: 760px; margin: 32px auto; padding: 0 16px; }
    header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    header h1 { font-size: 18px; margin: 0; }
    header .count { color: var(--muted); font-size: 13px; }
    header button {
      margin-left: auto; border: 1px solid var(--line); background: #fff; color: var(--fg);
      border-radius: 6px; padding: 6px 12px; cursor: pointer;
    }
    header button:hover { border-color: #d83931; color: #d83931; }
    .list { background: #fff; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    .item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--line); }
    .item:first-child { border-top: none; }
    .badge {
      flex: none; width: 46px; text-align: center; font-size: 11px; font-weight: 700;
      padding: 3px 0; border-radius: 5px; color: #fff;
    }
    .b-md { background: #2ea121; } .b-html { background: #f59e0b; }
    .b-word { background: #2b579a; } .b-pdf { background: #d83931; } .b-other { background: #8a8f99; }
    .meta { min-width: 0; }
    .meta .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .meta .s { color: var(--muted); font-size: 12px; }
    .empty { color: var(--muted); text-align: center; padding: 48px 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>导出历史</h1>
      <span class="count" id="count"></span>
      <button id="clear">清空历史</button>
    </header>
    <div class="list" id="list"></div>
  </div>
  <script src="history.js"></script>
</body>
</html>
